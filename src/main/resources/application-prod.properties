# prod profile. application.properties 위에 덮어쓴다.
#
# 여기 있는 ${...}에는 기본값을 두지 않는다. 환경변수가 없으면 기동이 실패해야 한다.
# localhost DB, root 계정, 개발용 JWT fallback을 prod에서 사용하지 않는다.
# 실제 값은 EC2의 .env.prod(compose env_file) 또는 process 환경변수로만 주입한다.

spring.config.import=optional:file:.env[.properties]

# DataSource
# DB_URL은 private RDS endpoint를 사용하고 sslMode=REQUIRED를 포함한다.
# sslMode=REQUIRED는 전송 암호화만 보장하고 hostname identity 검증은 하지 않는다.
# 이는 시연용 fast path의 의도적 tradeoff이며, private RDS + EC2 Security Group source 제한이 필수 전제다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# SQL 초기화: prod에서는 schema.sql/data.sql을 절대 실행하지 않는다.
spring.sql.init.mode=never

# JPA: 구조 변경 금지, 검증만 수행
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Nginx 뒤에서 동작하므로 X-Forwarded-* 를 신뢰한다.
server.forward-headers-strategy=framework

# EPUB upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# Swagger 비공개
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# EPUB 저장소: prod는 S3만 허용한다(EpubStorageProdGuard가 기동 시 검증).
app.epub.storage=${EPUB_STORAGE}
app.aws.region=${AWS_REGION}
app.s3.epub-bucket=${EPUB_BUCKET}

# EPUB S3 migration은 prod에서도 기본 비활성 + dry-run이며 별도 process로만 실행한다.
app.epub-migration.enabled=${EPUB_MIGRATION_ENABLED:false}
app.epub-migration.dry-run=${EPUB_MIGRATION_DRY_RUN:true}
app.epub-migration.batch-size=${EPUB_MIGRATION_BATCH_SIZE:50}

# 외부 도서 API는 prod 기본 disabled
external.book.enabled=${BOOK_API_ENABLED:false}

# Nginx가 신뢰된 proxy이므로 EC2 loopback을 기본값으로 둔다.
library.rate-limit.trusted-proxies=${LIBRARY_TRUSTED_PROXIES:127.0.0.1}

# secret과 SQL을 로그에 남기지 않는다.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.jdbc.core=WARN
