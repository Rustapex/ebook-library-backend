spring.application.name=ABC

# 로컬 DB 접속 정보 파일. .env.example을 .env로 복사한 뒤 DB_PASSWORD를 설정한다.
spring.config.import=optional:file:.env[.properties]

# DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ABC?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL 초기화
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true
# 인코딩 미지정 시 JVM 플랫폼 기본 charset으로 schema.sql/data.sql을 읽어 한글 리터럴이
# 깨질 수 있다(회원정보수정 보완계획 §5.4). data.sql의 member_grade는 ON DUPLICATE KEY
# UPDATE로 매 부팅마다 덮어쓰므로, 이 설정만으로 기존 손상 행도 다음 부팅 시 복구된다.
spring.sql.init.encoding=UTF-8

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# EPUB upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# EPUB 저장소. db=DB LONGBLOB(로컬 기본), s3=private S3 object.
# s3 mode는 EC2 Instance Profile 등 AWS default credential provider chain을 사용한다.
# access key/secret key property는 만들지 않는다.
app.epub.storage=${EPUB_STORAGE:db}
app.aws.region=${AWS_REGION:ap-northeast-2}
app.s3.epub-bucket=${EPUB_BUCKET:}

# EPUB S3 one-off migration. 기본 비활성 + dry-run이며 application 기동 시 자동 실행되지 않는다.
# EpubS3MigrationRunner를 별도 process로 실행할 때만 사용한다.
app.epub-migration.enabled=${EPUB_MIGRATION_ENABLED:false}
app.epub-migration.dry-run=${EPUB_MIGRATION_DRY_RUN:true}
app.epub-migration.batch-size=${EPUB_MIGRATION_BATCH_SIZE:50}

# JWT
jwt.secret=${JWT_SECRET:local-dev-jwt-secret-must-be-changed}
jwt.expiration=${JWT_EXPIRATION:86400}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# 종이책 소장 도서관 위치 조회 - rate limit 우회 방지용 신뢰된 proxy IP 목록(comma 구분). 비어있으면 X-Forwarded-For를 신뢰하지 않는다.
library.rate-limit.trusted-proxies=${LIBRARY_TRUSTED_PROXIES:}

# 외부 도서 API (정보나루/네이버/알라딘)
external.book.infonaru.key=${INFONARU_KEY:}
external.book.naver.clients[0].id=${NAVER_CLIENT_ID_1:}
external.book.naver.clients[0].secret=${NAVER_CLIENT_SECRET_1:}
external.book.aladin.keys[0]=${ALADIN_TTB_KEY_1:}
external.book.timeout-ms=${BOOK_API_TIMEOUT_MS:5000}
external.book.enabled=${BOOK_API_ENABLED:false}
