# ABC API reverse proxy template (EC2 host Nginx + Let's Encrypt)
#
# 설치 위치 예시:
#   /etc/nginx/sites-available/abc-api.conf  (symlink -> /etc/nginx/sites-enabled/)
#   또는 /etc/nginx/conf.d/abc-api.conf
#
# certificate 경로는 certbot 표준 경로 placeholder다. certbot 실행 전에는
# 아래 443 server block을 주석 처리한 상태로 80만 올려서 HTTP-01 challenge를 통과시킨다.
#
# 검증:
#   sudo nginx -t                 # 문법 + 참조 file 검증 (반드시 exit 0 확인)
#   sudo systemctl reload nginx   # nginx -t 통과 후에만 reload

upstream abc_api_upstream {
    # compose.prod.yml이 127.0.0.1:8080에만 bind한다.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.portfoliodev.click;

    # certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 그 외 모든 요청은 HTTPS로 redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.portfoliodev.click;

    # --- Let's Encrypt 표준 경로 placeholder ---
    ssl_certificate     /etc/letsencrypt/live/api.portfoliodev.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.portfoliodev.click/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:ABCSSL:10m;
    ssl_session_tickets off;

    # EPUB upload 50MB + multipart overhead
    client_max_body_size 51m;
    client_body_timeout  180s;

    # 대용량 EPUB upload/download는 buffering하지 않고 흘려보낸다.
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_http_version      1.1;

    proxy_connect_timeout 60s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    location / {
        proxy_pass http://abc_api_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";
    }
}
