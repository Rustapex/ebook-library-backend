name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (MySQL ${{ matrix.mysql-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mysql-version:
          - "8.0.40"
          - "8.0.42"

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: abc-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=abc-ci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: abc-ci-root
      MYSQL_SQL_MODE: NO_ENGINE_SUBSTITUTION
      MYSQL_TIME_ZONE: "+00:00"
      DB_URL: jdbc:mysql://127.0.0.1:3306/abc_ci?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: abc-ci-root
      SPRING_SQL_INIT_MODE: never
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify MySQL client and server contract
        shell: bash
        run: |
          set -euo pipefail
          mysql --version
          mysqldump --version
          export MYSQL_PWD="$MYSQL_PASSWORD"
          mysql \
            --protocol=TCP \
            --host="$MYSQL_HOST" \
            --port="$MYSQL_PORT" \
            --user="$MYSQL_USER" \
            -e "SET GLOBAL sql_mode='NO_ENGINE_SUBSTITUTION'; SET GLOBAL time_zone='+00:00'"
          actual=$(mysql \
            --protocol=TCP \
            --host="$MYSQL_HOST" \
            --port="$MYSQL_PORT" \
            --user="$MYSQL_USER" \
            --batch \
            --skip-column-names \
            -e "SELECT CONCAT(VERSION(), '|', @@GLOBAL.sql_mode, '|', @@GLOBAL.time_zone, '|', @@character_set_server, '|', @@collation_server)")
          expected="${{ matrix.mysql-version }}|NO_ENGINE_SUBSTITUTION|+00:00|utf8mb4|utf8mb4_0900_ai_ci"
          if [[ "$actual" != "$expected" ]]; then
            echo "MySQL service contract mismatch: $actual" >&2
            exit 1
          fi

      - name: Bootstrap canonical fresh database
        shell: bash
        run: |
          set -euo pipefail
          runtime_contract_version=$(sed -n -E \
            's/^runtimeContractVersion:[[:space:]]*([1-9][0-9]*)[[:space:]]*$/\1/p' \
            release-contract.yml)
          if [[ ! "$runtime_contract_version" =~ ^[1-9][0-9]*$ ]] \
            || [[ $(grep -c '^runtimeContractVersion:' release-contract.yml) -ne 1 ]]
          then
            echo "release-contract.yml must contain one positive integer runtimeContractVersion" >&2
            exit 1
          fi
          bash deploy/db/bootstrap-fresh.sh "$GITHUB_WORKSPACE" abc_ci
          bash deploy/db/verify-runtime-contract.sh abc_ci "$runtime_contract_version"

      - name: Verify PR schema and migration contract
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash deploy/db/verify-schema-contract.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Run Gradle tests
        run: ./gradlew --no-daemon test

  image:
    name: Docker and Compose
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject committed private keys and AWS access keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -l -E \
            -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}' \
            -- . ':!*.md'
          then
            echo "potential credential material found in tracked files" >&2
            exit 1
          fi

      - name: Build immutable CI image
        run: docker build --tag "abc-api:${GITHUB_SHA}" .

      - name: Verify Compose without resolving secrets to logs
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            rm -f .env.prod
          }
          trap cleanup EXIT INT TERM
          cp .env.prod.ci .env.prod
          docker compose \
            --env-file .env.prod.ci \
            -f compose.prod.yml \
            config --quiet
          sh deploy/verify-compose-image-tag.sh
