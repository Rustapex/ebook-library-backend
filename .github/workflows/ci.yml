name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 09:32 Asia/Seoul (UTC+09:00)
    - cron: "32 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect application sources
        id: project
        shell: bash
        run: |
          if [[ -f "build.gradle" || -f "build.gradle.kts" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run tests
        if: steps.project.outputs.present == 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Bootstrap confirmation
        if: steps.project.outputs.present != 'true'
        run: echo "No backend source has been migrated yet; CI bootstrap completed."
