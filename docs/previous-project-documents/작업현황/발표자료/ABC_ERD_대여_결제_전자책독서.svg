  <g transform="translate(1090,210)"><rect width="410" height="185" rx="14" class="card"/><rect width="410" height="46" rx="14" fill="#d97706"/><rect y="32" width="410" height="14" fill="#d97706"/><text x="20" y="31" class="head">COUPON_USAGE</text><text x="20" y="80" class="pk">PK  coupon_usage_id</text><text x="20" y="108" class="field">FK  member_coupon_id</text><text x="20" y="136" class="field">FK  rental_id · payment_id</text><text x="20" y="164" class="field">discount_amount · used_at</text></g>
