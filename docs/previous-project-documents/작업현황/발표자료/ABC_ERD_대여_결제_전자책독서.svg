  <rect x="55" y="145" width="1490" height="690" rx="24" class="panel"/>

  <g transform="translate(100,210)"><rect width="410" height="185" rx="14" class="card"/><rect width="410" height="46" rx="14" fill="#d97706"/><rect y="32" width="410" height="14" fill="#d97706"/><text x="20" y="31" class="head">BOOK_RENTAL</text><text x="20" y="80" class="pk">PK  rental_id</text><text x="20" y="108" class="field">FK  member_id · book_id</text><text x="20" y="136" class="field">rental_status · rental_end_at</text><text x="20" y="164" class="field">READY / READING / OWNED</text></g>
