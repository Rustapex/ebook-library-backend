<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
  <title id="title">ABC ERD - 대여, 결제, 전자책 독서</title>
  <style>
    .bg{fill:#fffbeb}.panel{fill:#fffbeb;stroke:#fcd34d;stroke-width:2}.title{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:40px;font-weight:700;fill:#0f172a}.sub{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:18px;fill:#64748b}.card{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.head{font-family:Consolas,'Courier New',monospace;font-size:22px;font-weight:700;fill:#fff}.pk{font-family:Consolas,'Courier New',monospace;font-size:17px;font-weight:700;fill:#0f172a}.field{font-family:Consolas,'Courier New',monospace;font-size:16px;fill:#334155}
  </style>
  <rect width="1600" height="900" class="bg"/>
