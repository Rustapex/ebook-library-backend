<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title">
  <title id="title">ABC ERD - 도서, 콘텐츠</title>
  <style>.bg{fill:#f0fdf4}.panel{fill:#f0fdf4;stroke:#86efac;stroke-width:2}.title{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:40px;font-weight:700;fill:#0f172a}.sub{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:18px;fill:#64748b}.card{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.head{font-family:Consolas,'Courier New',monospace;font-size:22px;font-weight:700;fill:#fff}.pk{font-family:Consolas,'Courier New',monospace;font-size:17px;font-weight:700;fill:#0f172a}.field{font-family:Consolas,'Courier New',monospace;font-size:16px;fill:#334155}</style>
  <rect width="1400" height="700" class="bg"/><text x="70" y="75" class="title">도서 · 콘텐츠</text><text x="70" y="110" class="sub">ABC 핵심 서비스 ERD · 발표용 요약</text><rect x="55" y="145" width="1290" height="480" rx="24" class="panel"/>
  <g transform="translate(100,220)"><rect width="520" height="235" rx="14" class="card"/><rect width="520" height="48" rx="14" fill="#16a34a"/><rect y="34" width="520" height="14" fill="#16a34a"/><text x="20" y="32" class="head">BOOK</text><text x="20" y="85" class="pk">PK  book_id</text><text x="20" y="114" class="field">title · isbn (UNIQUE) · status</text><text x="20" y="143" class="field">rental_type · rental_price</text><text x="20" y="172" class="field">total_pages · rental_count</text><text x="20" y="201" class="field">average_rating · review_count</text></g>
