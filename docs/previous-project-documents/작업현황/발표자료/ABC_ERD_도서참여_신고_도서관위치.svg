<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title">
  <title id="title">ABC ERD - 도서 참여, 신고, 도서관 위치</title>
  <style>.bg{fill:#fdf2f8}.panel{fill:#fdf2f8;stroke:#f9a8d4;stroke-width:2}.title{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:40px;font-weight:700;fill:#0f172a}.sub{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;font-size:18px;fill:#64748b}.card{fill:#fff;stroke:#94a3b8;stroke-width:1.6}.head{font-family:Consolas,'Courier New',monospace;font-size:22px;font-weight:700;fill:#fff}.pk{font-family:Consolas,'Courier New',monospace;font-size:17px;font-weight:700;fill:#0f172a}.field{font-family:Consolas,'Courier New',monospace;font-size:16px;fill:#334155}</style>
  <rect width="1600" height="920" class="bg"/><text x="70" y="75" class="title">도서 참여 · 신고 · 도서관 위치</text><text x="70" y="110" class="sub">ABC 핵심 서비스 ERD · 발표용 요약</text><rect x="55" y="145" width="1490" height="705" rx="24" class="panel"/>
  <g transform="translate(100,205)"><rect width="410" height="180" rx="14" class="card"/><rect width="410" height="46" rx="14" fill="#db2777"/><rect y="32" width="410" height="14" fill="#db2777"/><text x="20" y="31" class="head">REVIEW</text><text x="20" y="80" class="pk">PK  review_id</text><text x="20" y="108" class="field">FK  member_id · book_id</text><text x="20" y="136" class="field">content · status</text><text x="20" y="164" class="field">created_at · updated_at</text></g>
